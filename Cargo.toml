[package]
name = "hiyal"
default-run = "hiyal"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Experimental Rust-native agent-based simulation engine"
license = "MIT"
repository = "https://github.com/davletovb/hiyal"
publish = false

[features]
default = []
live-http = ["dep:reqwest"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# Exact float parsing: replay re-hashes parsed state, so a float that parses
# one ulp away breaks the chain for any world or action holding f64.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
rand_chacha = "0.9"
rand_core = "0.9"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

[target.'cfg(windows)'.dependencies]
atomicwrites = "0.4.4"

[workspace]
members = ["examples/custom_world", "examples/custom_model", "benchmarks/native"]
# Per-phase Criterion benchmarks: a standalone crate with its own lockfile, so
# `cargo test --workspace` in PR CI never builds Criterion. See its README.
exclude = ["benchmarks/phase"]
resolver = "3"
