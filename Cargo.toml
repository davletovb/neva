[package]
name = "hiyal"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
description = "Experimental Rust-native agent-based simulation engine"
license = "MIT"
repository = "https://github.com/davletovb/hiyal"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[workspace]
members = ["examples/custom_world"]
resolver = "3"
