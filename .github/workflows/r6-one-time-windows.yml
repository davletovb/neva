# One-off review verification. This workflow will be removed after the R6
# Windows checkpoint test, and never runs on ordinary synchronize/main events.
name: R6 Windows checkpoint verification (one-time)
on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: read

jobs:
  windows:
    if: github.head_ref == 'feat/r6-storage-research-review-gaps'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Show toolchain
        shell: bash
        run: |
          rustc --version
          cargo --version
      - name: Workspace tests including checkpoint durability
        run: cargo test --workspace --locked
      - name: Native CLI checkpoint and trusted resume smoke
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          cargo run --quiet --locked --bin hiyal -- run examples/counter.toml "$root/trial"
          cargo run --quiet --locked --bin hiyal -- resume "$root/trial" 3 --trusted-snapshot --checkpoint-durability
          cargo run --quiet --locked --bin hiyal -- validate "$root/trial"
          cargo run --quiet --locked --bin hiyal -- export "$root/trial" "$root/out.jsonl"
          test -s "$root/out.jsonl"
          rm -rf "$root"
