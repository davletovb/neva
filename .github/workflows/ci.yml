name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Black
        run: black --check .

      - name: isort
        run: isort --check-only .

      - name: Flake8
        run: flake8

      - name: MyPy
        run: mypy neva

      - name: Bandit
        run: bandit -r neva

      - name: Pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  tests:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

      - name: Upload coverage reports
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            coverage.xml
            htmlcov

  faiss:
    name: FAISS integration (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies including optional memory integration
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt '.[memory]'

      - name: Require native dependencies (do not silently skip)
        run: python -c "import faiss, numpy; print(faiss.__version__, numpy.__version__)"

      - name: Run FAISS tests and require zero skips
        run: |
          pytest tests/unit/test_memory_faiss.py --no-cov --junitxml=faiss-tests.xml
          python -c "import xml.etree.ElementTree as ET; suites = ET.parse('faiss-tests.xml').getroot().iter('testsuite'); assert sum(int(s.get('skipped', 0)) for s in suites) == 0, 'FAISS tests must not skip'"

      - name: Run complete suite with inclusive coverage
        run: pytest

      - name: Upload inclusive coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: faiss-coverage-reports
          path: |
            coverage.xml
            htmlcov
            faiss-tests.xml

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build documentation
        run: sphinx-build -b html docs docs/_build/html

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v7
        with:
          name: documentation-html
          path: docs/_build/html
