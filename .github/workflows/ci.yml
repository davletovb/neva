name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Black
        run: black --check .

      - name: isort
        run: isort --check-only .

      - name: Flake8
        run: flake8

      - name: MyPy
        run: mypy neva benchmarks

      - name: Bandit
        run: bandit -r neva benchmarks

      - name: Pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  tests:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

      - name: Upload coverage reports
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            coverage.xml
            htmlcov

  optional-integrations:
    name: Optional integrations (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements-dev.txt
            requirements-optional.txt

      - name: Install core and optional integration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.2.2
          pip install transformers==4.35.2 faiss-cpu==1.7.4 numpy==1.26.4 anthropic==0.26.0 httpx==0.27.2

      - name: Verify optional integration imports
        run: |
          python - <<'PY'
          import anthropic
          import faiss
          import httpx
          import numpy
          import torch
          import transformers

          print("torch", torch.__version__)
          print("transformers", transformers.__version__)
          print("faiss", getattr(faiss, "__version__", "unknown"))
          print("numpy", numpy.__version__)
          print("anthropic", anthropic.__version__)
          print("httpx", httpx.__version__)
          PY

      - name: Run real optional integrations
        run: |
          pytest -q -o addopts=""             tests/integration/test_optional_dependencies.py

      - name: Measure FAISS implementation coverage
        run: |
          pytest -q -o addopts=""             --cov=neva.memory.faiss_vector_store             --cov-report=term-missing             --cov-fail-under=80             tests/unit/test_memory_faiss.py

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build documentation
        run: sphinx-build -b html docs docs/_build/html

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v7
        with:
          name: documentation-html
          path: docs/_build/html
