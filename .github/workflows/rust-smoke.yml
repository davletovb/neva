# Deliberately separate from the Python CI kept on archive/hiyal-python-pre-r5.
# One Linux smoke job for PR changes and main; no costly multi-platform matrix.
name: Rust smoke (cost controlled)

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'benchmarks/native/**'
      - 'src/**'
      - 'examples/**'
      - 'tests/**'
      - 'fixtures/**'
      - '.github/workflows/rust-smoke.yml'
  workflow_dispatch:
    inputs:
      extended:
        description: 'Run additional Clippy checks (manual verification)'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: rust-smoke-${{ github.head_ref || github.ref_name }}
  # A stale PR/manual run should not consume more minutes. Never cancel a tag release.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  essential:
    name: Rust essentials (Ubuntu)
    # Draft PRs are cheap: GitHub does not allocate a runner to a skipped job.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Toolchain identity
        run: |
          rustc --version
          cargo --version

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust workspace unit and integration tests
        # R0 has no committed lockfile yet. When it is added, enforce it strictly.
        run: |
          cargo test --workspace --locked

      - name: Clippy Rust workspace gate
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Deterministic map-order regression (feature unification)
        run: cargo test -p hiyal --locked --features serde_json/preserve_order

      # Only the stable-JSON writer's differential tests: the full suite does
      # not yet pass with arbitrary_precision (tests/float_state.rs, also on main).
      - name: Stable JSON writer under serde_json special-struct features
        run: cargo test -p hiyal --locked --features serde_json/arbitrary_precision,serde_json/raw_value --lib canonical

      - name: Opt-in HTTP adapter loopback test
        run: cargo test -p hiyal --locked --features live-http

      - name: Native CLI run and resume smoke
        run: |
          work="$(mktemp -d)"
          cargo run --locked --quiet -p hiyal -- run examples/counter.toml "$work/builtin"
          cargo run --locked --quiet -p hiyal -- inspect "$work/builtin"
          cargo run --locked --quiet -p hiyal -- resume "$work/builtin" 3
          cargo run --locked --quiet -p hiyal -- validate "$work/builtin"
          cargo run --locked --quiet -p hiyal-custom-world-example -- run "$work/custom" 5
          cargo run --locked --quiet -p hiyal-custom-world-example -- resume "$work/custom" 5
          cargo run --locked --quiet -p hiyal-custom-world-example -- inspect "$work/custom"
          rm -rf "$work"

      - name: R2 research smoke (Rust only; no Python benchmarks)
        run: |
          work="$(mktemp -d)"
          cargo run --locked --quiet -p hiyal -- sweep examples/sweep.toml "$work/sweep"
          test -s "$work/sweep/results.csv"
          cp "$work/sweep/results.csv" "$work/first.csv"
          cargo run --locked --quiet -p hiyal -- sweep examples/sweep.toml "$work/sweep"
          cmp "$work/first.csv" "$work/sweep/results.csv"
          cargo run --locked --quiet -p hiyal -- run examples/counter.toml "$work/parent"
          cargo run --locked --quiet -p hiyal -- fork "$work/parent" "$work/paired" 3 8
          test -s "$work/paired/control/ancestry/events.jsonl"
          test -s "$work/paired/treatment/fork.json"
          cargo run --locked --quiet -p hiyal -- fork "$work/parent" "$work/paired" 3 8
          cargo run --locked --quiet -p hiyal -- validate "$work/paired/control"
          cp "$work/paired/control/fork.json" "$work/fork.backup"
          printf 'broken attribution' > "$work/paired/control/fork.json"
          if cargo run --locked --quiet -p hiyal -- validate "$work/paired/control"; then
            echo "incorrectly validated a corrupt fork" >&2
            exit 1
          fi
          mv "$work/fork.backup" "$work/paired/control/fork.json"
          mv "$work/paired/control/fork.json" "$work/fork.backup"
          mv "$work/paired/control/ancestry" "$work/ancestry.backup"
          if cargo run --locked --quiet -p hiyal -- validate "$work/paired/control"; then
            echo "incorrectly validated a fork with no ancestry artifacts" >&2
            exit 1
          fi
          mv "$work/fork.backup" "$work/paired/control/fork.json"
          mv "$work/ancestry.backup" "$work/paired/control/ancestry"

          # Restart must reject a different source parent.
          sed 's/name = "counter-demo"/name = "another-parent"/' examples/counter.toml > "$work/other.toml"
          cargo run --locked --quiet -p hiyal -- run "$work/other.toml" "$work/other"
          if cargo run --locked --quiet -p hiyal -- fork "$work/other" "$work/paired" 3 8; then
            echo "incorrectly accepted different parent" >&2
            exit 1
          fi

          # Simulate death between two published (fully verified) fork arms.
          cargo run --locked --quiet -p hiyal -- fork "$work/parent" "$work/half" 3 0
          rm -rf "$work/half/treatment"
          cargo run --locked --quiet -p hiyal -- fork "$work/parent" "$work/half" 3 0

          # Never silently accept swapped control/treatment directories.
          mv "$work/half/control" "$work/half/temp"
          mv "$work/half/treatment" "$work/half/control"
          mv "$work/half/temp" "$work/half/treatment"
          if cargo run --locked --quiet -p hiyal -- fork "$work/parent" "$work/half" 3 0; then
            echo "incorrectly accepted swapped arms" >&2
            exit 1
          fi
          rm -rf "$work"

      - name: Standalone external-world smoke
        run: |
          cargo run --locked --quiet -p hiyal-custom-world-example >/tmp/hiyal-events.jsonl
          test "$(wc -l </tmp/hiyal-events.jsonl)" -eq 6
      - name: Independent offline custom-model smoke
        run: cargo run --locked --quiet -p hiyal-custom-model-example
      - name: Benchmark provenance smoke (3 native offline steps)
        run: |
          cargo run --locked --quiet -p hiyal-native-bench -- 2 3 off > /tmp/hiyal-r5-bench.jsonl
          grep -E '"rust_version":"rustc [0-9]+' /tmp/hiyal-r5-bench.jsonl


      - name: Additional release/manual lint
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.extended) }}
        run: cargo clippy --workspace --all-targets -- -D warnings
