# Manual per-phase engine benchmarks with provenance. Never runs on PRs,
# pushes, tags or a schedule; see docs/ci-budget.md and docs/profiling.md.
name: Phase benchmarks (manual)

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'phase-report suite'
        type: choice
        options: [baseline, full]
        default: baseline
      criterion:
        description: 'Also run the Criterion suite (adds several minutes)'
        type: boolean
        default: true
      compare_base:
        description: 'Optional base revision: alternate it against this commit on the same runner'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: phase-benchmarks-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  phases:
    name: Phase benchmarks (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: 1.89.0
      SUITE: ${{ inputs.suite }}
      COMPARE_BASE: ${{ inputs.compare_base }}
      OUT: ${{ github.workspace }}/phase-artifacts
    steps:
      - name: Checkout (full history for comparisons)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pinned toolchain and machine record
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          mkdir -p "$OUT"
          {
            echo "commit: $GITHUB_SHA"
            rustc -vV
            cargo -V
            uname -a
            lscpu
            grep -E 'MemTotal|MemAvailable' /proc/meminfo
            df -h "$GITHUB_WORKSPACE"
          } | tee "$OUT/machine.txt"

      - name: Check the benchmark crate (excluded from PR CI)
        working-directory: benchmarks/phase
        run: |
          cargo fmt --check
          cargo test --locked

      - name: Build phase-report
        working-directory: benchmarks/phase
        run: |
          cargo build --locked --release --bin phase-report
          # Shows the SHA-NI code path is compiled in; the report's
          # sha2_hardware_backend field shows whether it is selected here.
          echo "sha256rnds2 instructions in phase-report: $(objdump -d --no-show-raw-insn target/release/phase-report | grep -c sha256rnds2 || true)" \
            | tee -a "$OUT/machine.txt"

      - name: Phase report (warm, cold process, page cache dropped)
        working-directory: benchmarks/phase
        run: |
          ./target/release/phase-report run --suite "$SUITE" --reps 5 --cold --drop-caches \
            --label "$GITHUB_SHA" --out "$OUT/phase-report.json"
          ./target/release/phase-report summarize "$OUT/phase-report.json" | tee "$OUT/summary.md"

      - name: Criterion suite
        if: ${{ inputs.criterion }}
        working-directory: benchmarks/phase
        run: |
          cargo bench --locked --bench phases
          cp -r target/criterion "$OUT/criterion"

      - name: Alternating comparison against the base revision
        if: ${{ inputs.compare_base != '' }}
        run: benchmarks/phase/compare.sh "$COMPARE_BASE" "$GITHUB_SHA" 5 "$OUT/compare"

      - name: Upload results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: phase-benchmarks-${{ github.sha }}
          path: phase-artifacts
          retention-days: 90
