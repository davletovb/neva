[build-system]
requires = ["poetry-core>=1.6.1"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "neva"
version = "0.1.0"
description = "Neva provides agent, environment, and scheduler abstractions for LLM-based simulations."
authors = ["Neva Contributors"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/davletovb/neva"
repository = "https://github.com/davletovb/neva"
documentation = "https://github.com/davletovb/neva#readme"
keywords = [
    "llm",
    "agents",
    "multi-agent",
    "simulation",
    "agent-based-modeling",
    "ai",
    "generative-ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
packages = [{ include = "neva" }]

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/davletovb/neva/issues"
"Changelog" = "https://github.com/davletovb/neva/blob/main/CHANGELOG.md"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
requests = "^2.31.0"
wikipedia = { version = "1.4.0", optional = true }
"opentelemetry-api" = { version = "^1.23.0", optional = true }
"opentelemetry-sdk" = { version = "^1.23.0", optional = true }
"deep-translator" = { version = "^1.11.4", optional = true }
transformers = { version = "^4.35.2", optional = true }
torch = { version = "^2.2.2", optional = true }
mlflow = { version = "^2.9.1", optional = true }
anthropic = { version = "^0.26.0", optional = true }
httpx = { version = ">=0.23,<0.28", optional = true }
"google-generativeai" = { version = "^0.3.2", optional = true }
"faiss-cpu" = { version = "^1.7.4", optional = true }
numpy = { version = "^1.26.4", optional = true }
# >=0.7.0 is the first release whose model map covers gpt-4o-mini, the model
# openai_chat_counter() accepts; 0.6.x raises KeyError and the documented flow
# fails with ConfigurationError. No upper bound so a newer tiktoken is not
# downgraded on install.
tiktoken = { version = ">=0.7.0", optional = true }

[tool.poetry.group.dev.dependencies]
black = "26.5.1"
coverage = "7.16.1"
mypy = "2.3.1"
pytest = "9.1.1"
pytest-cov = "7.1.0"
pytest-timeout = "2.4.0"
isort = "9.0.1"
flake8 = "7.3.0"
pre-commit = "4.6.2"
bandit = "1.9.4"
sphinx = "9.0.4"
types-requests = "2.33.0.20260906"

[tool.poetry.extras]
tools = ["wikipedia", "deep-translator", "transformers", "torch"]
mlops = ["mlflow"]
providers = ["anthropic", "httpx", "google-generativeai"]
budgeting = ["tiktoken"]
observability = ["opentelemetry-api", "opentelemetry-sdk"]
memory = ["faiss-cpu", "numpy"]
all = [
    "wikipedia",
    "deep-translator",
    "transformers",
    "torch",
    "mlflow",
    "anthropic",
    "httpx",
    "google-generativeai",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "faiss-cpu",
    "numpy",
    "tiktoken",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
addopts = "-ra --cov=neva --cov-report=term-missing --cov-report=xml --cov-report=html --cov-fail-under=80"
testpaths = ["tests"]
# Bound every test so a hang fails the job instead of burning the CI limit.
timeout = 120
timeout_method = "thread"

[tool.isort]
profile = "black"
line_length = 100
combine_as_imports = true
known_first_party = ["neva"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
per-file-ignores = [
  "examples/*.py: E402",
  "tests/**/*.py: E402"
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
follow_imports = "silent"
show_error_codes = true
plugins = []
files = ["neva"]

[tool.bandit]
skips = ["B101"]

